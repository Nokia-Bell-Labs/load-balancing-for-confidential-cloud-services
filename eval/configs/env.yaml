# Per-protocol endpoint configuration.
#
# Endpoints are intentionally left as TBD; the runner refuses to start until
# they are filled in for the target deployment.  Keeping deployment details
# in a config file (rather than client code) is what makes a run pinned to
# a specific environment reproducible from the CSV + this file alone.

maa:
  url: https://sharedweu.weu.attest.azure.net
  api_version: "2022-08-01"

payload:
  # Small static GET so total_e2e_ms is dominated by connection
  # establishment and attestation, not by application work.
  path: /static/small.html
  expected_min_bytes: 64
  expected_max_bytes: 8192

protocols:
  vanilla:
    host: TBD
    port: 8444
    # Empty string => use system trust roots (Let's Encrypt etc.).
    server_cert_ca: ""

  ctls_proxy:
    frontend_host: TBD
    frontend_port: 6037
    # No backend address from the client side: in proxy mode the frontend
    # is the only client-facing endpoint.
    backend_routing: via-frontend
    # Request path for the latency runs (default /: establishment only, as
    # measured for Table 2).  run_fig6.sh overrides it with
    # JANUS_PROXY_PATH=/forward/health so the throughput run relays to a backend.
    # path: /

  ctls_redirect:
    frontend_host: TBD
    frontend_port: 6037
    # Redirection needs a DC-capable TLS client: the NSS helper built from
    # janus/client/native/ and an NSS trust DB importing the CA root
    # (README.md, "DC-validating client").  Both are pre-installed on the
    # client VM; the paths must match eval/ae/testbed.env.
    nss_helper_bin: TBD   # e.g. ~/nss_client/nss_dc_helper
    nss_db: TBD   # e.g. ~/nss_client/nssdb
    # amortize_control: false   # latency runs pay the control leg per attempt (Table 2);
    #                           # run_fig6.sh sets JANUS_AMORTIZE_CONTROL=1 for the throughput run (as the shipped Fig. 6 data was measured)
    # The frontend's GET /route is authoritative: the client fetches the
    # backend(s) from it (single pick, or ?pool=1 for the amortized pool).
    # backend_host/port below are an optional offline fallback only.
    # backend_host: TBD
    # backend_port: 8443

  ratls:
    host: TBD
    port: 5004

  httpa:
    host: TBD
    port: 5002

  # The Oak and OHTTP+KMS baselines (baselines/oak, baselines/ohttp).
  ohttp_kms:
    # KMS = the Janus frontend code that runs as the KMS (baselines/ohttp/ohttp/kms.py)
    kms_host: TBD
    kms_port: 6038
    # Untrusted front end (no TEE) = the frontend code in direct mode. It forwards
    # /forward/ohttp to the gateways (load balancing in proxy mode, as on Azure).
    frontend_host: TBD
    frontend_port: 6039
    forward_path: /forward/ohttp
    # cold: delete the key configuration of the client AND rotate the KMS key
    # first. Thus the gateway also misses its cache and attests on that request
    # (the first request after a rotation). This needs OHTTP_ALLOW_ROTATE_API=1 on the KMS.
    rotate_on_cold: true
    server_cert_ca: ""
    # request path for this protocol; the paper runs requested / from apps/browser_app on the gateway CVM
    path: /

  oak:
    # Oak-style attested session (baselines/oak): one client and one server,
    # no load balancing, fresh evidence on every connection.
    host: TBD
    port: 8543
    server_cert_ca: ""
    # request path for this protocol; the paper runs requested / from apps/browser_app on the CVM
    path: /
    # optional: the launch measurement of the CVM that the client requires (the paper runs set it)
    expected_measurement: ""
