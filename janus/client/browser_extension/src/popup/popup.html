<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
           width: 320px; margin: 0; padding: 14px; color: #222; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .status { padding: 10px; border-radius: 6px; font-size: 13px; }
    .ok { background: #e6f4ea; border-left: 4px solid #1e8e3e; }
    .bad { background: #fce8e6; border-left: 4px solid #d32f2f; }
    .none { background: #f1f3f4; border-left: 4px solid #9aa0a6; }
    .kv { font-family: monospace; font-size: 11px; word-break: break-all;
          margin-top: 6px; color: #444; }
    a { display: inline-block; margin-top: 12px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>🛡️ Janus Attestation</h1>
  <div id="status" class="status none">Checking…</div>
  <a href="#" id="opts">Settings</a>
  <script src="popup.js"></script>
</body>
</html>
